# A commercial-safe COLMAP build for Windows.
#
# Same recipe as build-windows.yml, with everything that isn't licensed for
# commercial use left out:
#   * no SiftGPU (non-commercial): CUDA_ENABLED=OFF and OPENGL_ENABLED=OFF
#     keep GPU_ENABLED off, so src/thirdparty/SiftGPU is never compiled;
#   * no LSD (AGPL), no CGAL (GPL), no SuiteSparse (GPL parts): Ceres uses
#     Eigen's sparse solver instead (vcpkg.json), and so does COLMAP's own
#     sparse Cholesky (CHOLMOD_ENABLED=OFF, a patch on this branch);
#   * no GUI/Qt, no MVS, no download support (model files are bundled separately).
# ONNX Runtime (MIT, for LightGlue/ALIKED) is left out for now: COLMAP fetches
# it from github.com/microsoft/onnxruntime, which returns 404 (2026-11-24).
# It can come back from NuGet (Microsoft.ML.OnnxRuntime) later.
#
# GPU: gpumatch/ (CUDA, NVIDIA cards) matches the CPU-extracted SIFT
# features and writes them to COLMAP's database, where COLMAP's
# geometric_verifier checks them. It's built by the gpumatch job and
# shipped as bin/colmap-gpumatch.exe in the same package.
#
# The last lines of a failed step's log go into an error annotation, which
# GitHub's API shows without signing in (logs need a signed-in user).
#
# It doesn't use upstream's vcpkg binary cache (that is for COLMAP's own CI);
# it keeps its own in GitHub's Actions cache instead.

name: COLMAP commercial-safe (Windows)

on:
  push:
    branches:
      - siteref-*
    tags:
      - build-*
  workflow_dispatch:

# A new push waits for the running build rather than cancelling it, so a long
# library build always finishes and reaches the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The GPU matcher (gpumatch/): CUDA 13.2, installed as
  # upstream's build-windows.yml does, with the CUDA runtime linked in
  # statically, so the package gains one small exe and no NVIDIA libraries.
  # It runs beside the COLMAP build; the package job puts the two together.
  # It builds on the VS 2022 image with a host compiler CUDA 13.2 supports:
  # on windows-2025-vs2026 (MSVC 14.52, newer than CUDA 13.2 knows) cudafe++
  # crashed with 0xC0000005 even with -allow-unsupported-compiler.
  gpumatch:
    name: GPU matcher (CUDA)
    runs-on: windows-2022
    env:
      BUILD_LOG: ${{ github.workspace }}/gpumatch-build.log
    steps:
      - uses: actions/checkout@v7

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '13.2.0'
          method: network
          # upstream's list (build-windows.yml): CUDA 13's compiler needs crt,
          # nvvm, nvptxcompiler and thrust (the CCCL headers cuda_runtime.h
          # pulls in)
          sub-packages: '["nvcc", "crt", "nvvm", "nvptxcompiler", "thrust", "nvtx", "cudart", "curand", "curand_dev", "nvrtc_dev"]'

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.3.2"
          ninjaVersion: "1.12.1"

      - name: Build
        shell: pwsh
        run: |
          # the newest installed MSVC toolset that CUDA 13.2 supports (up to
          # VS 2022's 14.4x), listed in the log with the others
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $tools = foreach ($vs in (& $vswhere -all -products * -format json | ConvertFrom-Json)) {
            Get-ChildItem "$($vs.installationPath)/VC/Tools/MSVC" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { [pscustomobject]@{ vs = $vs; ver = [version]$_.Name } }
          }
          $tools | Sort-Object ver -Descending | ForEach-Object { "MSVC $($_.ver) in $($_.vs.installationPath)" } |
            Tee-Object -FilePath $env:BUILD_LOG -Append
          $pick = $tools | Where-Object { $_.ver -lt [version]'14.50' } | Sort-Object ver -Descending | Select-Object -First 1
          if (-not $pick) { "No MSVC toolset older than 14.50 here (CUDA 13.2 supports up to 14.4x)" | Tee-Object -FilePath $env:BUILD_LOG -Append; exit 1 }
          Import-Module "$($pick.vs.installationPath)/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstanceId $pick.vs.instanceId -SkipAutomaticLocation `
            -DevCmdArguments "-no_logo -arch=amd64 -host_arch=amd64 -vcvars_ver=$($pick.ver)"
          cd ${{ github.workspace }}
          "Using MSVC $($pick.ver): $((Get-Command cl.exe).Source)" | Tee-Object -FilePath $env:BUILD_LOG -Append
          cmake -S gpumatch -B build-gpumatch -GNinja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES=all-major `
            -DCUDAToolkit_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" `
            -DCMAKE_INSTALL_PREFIX=install-gpumatch 2>&1 | Tee-Object -FilePath $env:BUILD_LOG -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ninja -C build-gpumatch install 2>&1 | Tee-Object -FilePath $env:BUILD_LOG -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check it needs no CUDA or C runtime libraries, and starts
        shell: pwsh
        run: |
          ./scripts/shell/enter_vs_dev_shell.ps1
          cd ${{ github.workspace }}
          $exe = "install-gpumatch/bin/colmap-gpumatch.exe"
          $deps = dumpbin /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          Write-Host "Depends on: $($deps -join ', ')"
          $bad = $deps | Where-Object { $_ -match '^(cudart|cublas|cudnn|nvrtc|msvcp|vcruntime)' }
          if ($bad) { Write-Error "unexpected DLLs: $($bad -join ', ')"; exit 1 }
          Write-Host ("Size: {0:N0} KB" -f ((Get-Item $exe).Length / 1KB))
          # no GPU here: it must say so and exit 2 (callers then use COLMAP's CPU matcher)
          $out = & $exe --check
          $code = $LASTEXITCODE
          Write-Host "--check: $out (exit $code)"
          if ($code -ne 2 -or "$out" -notmatch '"ok":false') { Write-Error "--check should report no usable GPU on the runner"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Report the error (readable without signing in)
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path $env:BUILD_LOG) {
            $tail = (Get-Content $env:BUILD_LOG -Tail 80) -join "`n"
            $msg = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Last lines of the GPU matcher build log::$msg"
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: colmap-gpumatch
          path: install-gpumatch/bin/colmap-gpumatch.exe

  # COLMAP and the GPU matcher in one package: colmap-x64-windows-commercial.
  # On a build-* tag it is also published as a pre-release on this repo,
  # so it can be downloaded (and pinned by SHA-256) without signing in.
  package:
    name: Package
    needs: [build, gpumatch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: colmap-cpu
          path: package
      - uses: actions/download-artifact@v7
        with:
          name: colmap-gpumatch
          path: package/bin
      - name: List, zip and hash
        run: |
          ls -la package/bin/colmap-gpumatch.exe package/bin/colmap.exe
          du -sh package
          (cd package && zip -qr9 ../colmap-x64-windows-commercial.zip .)
          ls -la colmap-x64-windows-commercial.zip
          sha256sum colmap-x64-windows-commercial.zip | tee colmap-x64-windows-commercial.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: colmap-x64-windows-commercial
          path: package
      - name: Publish the pre-release (build-* tags only)
        if: startsWith(github.ref, 'refs/tags/build-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          sha=$(cut -d' ' -f1 colmap-x64-windows-commercial.zip.sha256)
          gh release create "$tag" colmap-x64-windows-commercial.zip colmap-x64-windows-commercial.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "COLMAP commercial-safe package ($tag)" \
            --notes "COLMAP 4.2.1 for Windows without SiftGPU, LSD, CGAL, SuiteSparse, Qt or CUDA libraries, with the gpumatch CUDA matcher (bin/colmap-gpumatch.exe), from commit $GITHUB_SHA. SHA-256 of the zip: $sha"

  build:
    name: Windows Release, commercial-safe
    runs-on: windows-2025-vs2026

    env:
      VCPKG_TAG: "2026.10.16"
      VCPKG_CACHE_DIR: ${{ github.workspace }}/vcpkg-cache
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
      BUILD_LOG: ${{ github.workspace }}/colmap-build.log
      # bump to rebuild COLMAP when only this file's build settings change
      COLMAP_BUILD_REV: "1"

    steps:
      - uses: actions/checkout@v7

      # COLMAP built before from the same sources and settings: skip building it
      - name: Restore the built COLMAP
        uses: actions/cache/restore@v4
        id: pkg
        with:
          path: build/install
          key: cs-colmap-install-${{ env.COLMAP_BUILD_REV }}-${{ env.VCPKG_TAG }}-${{ hashFiles('src/**', 'cmake/**', 'CMakeLists.txt', 'vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Restore vcpkg binary cache
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: cs-vcpkg-v2-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg/ports/**') }}
          restore-keys: cs-vcpkg-v2-${{ env.VCPKG_TAG }}-

      - name: Use the local vcpkg binary cache
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_CACHE_DIR }}" | Out-Null
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ env.VCPKG_CACHE_DIR }},readwrite" >> "${env:GITHUB_ENV}"

      - name: Restore compiler cache
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: ./.github/actions/compiler-cache
        id: cache-compiler
        with:
          mode: restore
          path: ${{ env.COMPILER_CACHE_DIR }}
          key-suffix: windows-cs

      - name: Install compile cache
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.CCACHE_DIR }}"
          echo "${{ env.COMPILER_CACHE_DIR }}/bin" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_PATH
          if (!(Test-Path -PathType Leaf "${{ env.COMPILER_CACHE_DIR }}/bin/ccache.exe")) {
            .github/workflows/install-ccache.ps1 -Destination "${{ env.COMPILER_CACHE_DIR }}/bin"
          }
          & "${{ env.COMPILER_CACHE_DIR }}/bin/ccache.exe" --zero-stats

      - name: Setup vcpkg (pinned release)
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/shell/enter_vs_dev_shell.ps1
          cd ${{ github.workspace }}
          git clone --branch ${{ env.VCPKG_TAG }} --depth 1 https://github.com/microsoft/vcpkg
          cd vcpkg
          ./bootstrap-vcpkg.bat

      - name: Install CMake and Ninja
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.3.2"
          ninjaVersion: "1.12.1"

      # Its own step, so the libraries (about 45 minutes from scratch) reach
      # the cache even if configuring or building COLMAP fails afterwards.
      - name: Build the libraries (vcpkg)
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/shell/enter_vs_dev_shell.ps1
          cd ${{ github.workspace }}
          ./vcpkg/vcpkg.exe install `
            --triplet=x64-windows-release `
            --x-no-default-features `
            --x-install-root=build/vcpkg_installed 2>&1 | Tee-Object -FilePath $env:BUILD_LOG -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Save vcpkg binary cache
        if: steps.pkg.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: cs-vcpkg-v2-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg/ports/**') }}

      - name: Configure and build
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/shell/enter_vs_dev_shell.ps1
          cd ${{ github.workspace }}
          ./vcpkg/vcpkg.exe integrate install
          mkdir -Force build
          cd build
          cmake .. `
            -GNinja `
            -DCOLMAP_HASH_MAP_BACKEND=BOOST `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTESTS_ENABLED=OFF `
            -DCUDA_ENABLED=OFF `
            -DOPENGL_ENABLED=OFF `
            -DGUI_ENABLED=OFF `
            -DMVS_ENABLED=OFF `
            -DLSD_ENABLED=OFF `
            -DCGAL_ENABLED=OFF `
            -DCHOLMOD_ENABLED=OFF `
            -DDOWNLOAD_ENABLED=OFF `
            -DONNX_ENABLED=OFF `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_USE_LEGACY_APPLOCAL=ON `
            -DCMAKE_INSTALL_PREFIX=install 2>&1 | Tee-Object -FilePath $env:BUILD_LOG -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ninja 2>&1 | Tee-Object -FilePath $env:BUILD_LOG -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Export package
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./vcpkg/vcpkg.exe integrate install
          cd build
          ninja install
          ../vcpkg/vcpkg.exe install --triplet=x64-windows-release --x-no-default-features
          ../vcpkg/vcpkg.exe export --raw --output-dir vcpkg_export --output colmap
          cp vcpkg_export/colmap/installed/x64-windows/bin/*.dll install/bin -ErrorAction SilentlyContinue
          cp vcpkg_export/colmap/installed/x64-windows-release/bin/*.dll install/bin
          # CPU only for now: the CUDA/TensorRT providers are hundreds of MB and
          # COLMAP only asks for them when built with CUDA.
          Remove-Item -Force -ErrorAction SilentlyContinue install/bin/onnxruntime_providers_cuda.dll, install/bin/onnxruntime_providers_tensorrt.dll
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue install/include,install/lib,install/share
          # Licence texts of what's bundled.
          New-Item -ItemType Directory -Force -Path install/licenses | Out-Null
          cp ../COPYING.txt install/licenses/COLMAP-COPYING.txt
          Get-ChildItem vcpkg_export/colmap/installed/x64-windows-release/share -Recurse -Filter copyright |
            ForEach-Object { cp $_.FullName ("install/licenses/" + $_.Directory.Name + ".txt") }
          # Libraries COLMAP fetches itself and links in statically (faiss for the vocabulary tree, PoseLib, ...):
          # their notices are in the fetched sources, not vcpkg's share folder
          Get-ChildItem _deps -Directory -Filter *-src | ForEach-Object {
            $lic = Get-ChildItem $_.FullName -File | Where-Object { $_.Name -match '^(LICEN[CS]E|COPYING)' } | Select-Object -First 1
            if ($lic) { cp $lic.FullName ("install/licenses/" + ($_.Name -replace '-src$', '') + ".txt") }
            else { Write-Host "::warning::no licence file found in $($_.Name)" }
          }
          Get-ChildItem install/licenses | Select-Object -ExpandProperty Name

      - name: Check nothing non-commercial or copyleft got in
        if: steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd build
          $bad = @()
          if (Test-Path src/thirdparty/SiftGPU) { $bad += "SiftGPU was built (build/src/thirdparty/SiftGPU exists)" }
          if (Test-Path src/thirdparty/LSD) { $bad += "LSD was built" }
          foreach ($pat in '*cholmod*', '*spqr*', '*suitesparse*', '*CGAL*', '*gmp*', '*mpfr*', 'Qt6*', '*glew*', '*providers_cuda*', '*providers_tensorrt*') {
            $hits = Get-ChildItem install -Recurse -Filter $pat -ErrorAction SilentlyContinue
            foreach ($h in $hits) { $bad += "unexpected file: $($h.FullName)" }
          }
          $cache = Get-Content CMakeCache.txt
          foreach ($opt in 'CUDA_ENABLED:BOOL=OFF', 'OPENGL_ENABLED:BOOL=OFF', 'LSD_ENABLED:BOOL=OFF', 'CGAL_ENABLED:BOOL=OFF', 'CHOLMOD_ENABLED:BOOL=OFF') {
            if (-not ($cache -contains $opt)) { $bad += "CMakeCache.txt lacks $opt" }
          }
          if ($bad.Count) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          ./install/bin/colmap.exe help | Select-Object -First 3
          Write-Host "Package contents:"
          Get-ChildItem install -Recurse -File | Sort-Object Length -Descending |
            ForEach-Object { "{0,10:N0} KB  {1}" -f ($_.Length / 1KB), $_.FullName.Substring((Resolve-Path install).Path.Length + 1) }
          $total = (Get-ChildItem install -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Total: {0:N1} MB" -f ($total / 1MB))

      - name: Report the error (readable without signing in)
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path $env:BUILD_LOG) {
            $tail = (Get-Content $env:BUILD_LOG -Tail 80) -join "`n"
            $msg = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Last lines of the build log::$msg"
          }

      - name: Save the built COLMAP
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/install
          key: ${{ steps.pkg.outputs.cache-primary-key }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: colmap-cpu
          path: build/install

      - name: Cleanup compiler cache
        if: always() && steps.pkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ccache --cleanup
          ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.pkg.outputs.cache-hit != 'true'
        uses: ./.github/actions/compiler-cache
        with:
          mode: save
          key: ${{ steps.cache-compiler.outputs.key }}
          path: ${{ env.COMPILER_CACHE_DIR }}
          cache-hit: ${{ steps.cache-compiler.outputs.cache-hit }}
